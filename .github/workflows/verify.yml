name: Verify Windows game and single EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Rules, UI, native messages and package parity
        shell: pwsh
        run: ./tools/verify-program.ps1
      - name: Retain verification and executable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solitude-verification
          path: |
            artifacts/verification/verification.json
            artifacts/verification/package/Solitude.exe
            artifacts/program-fixes/*.png
          if-no-files-found: warn
          retention-days: 14
